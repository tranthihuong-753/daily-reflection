<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Biết ơn</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="p-4">
  <h2 class="text-center mb-4">🌿 Những điều biết ơn hôm nay</h2>

  <form method="POST" class="mb-3">
    {% csrf_token %}
    <textarea name="NoiDung" class="form-control mb-2" placeholder="Nhập điều biết ơn..." required></textarea>
    <button class="btn btn-success w-100">Lưu</button>
  </form>

  <table class="table table-striped">
    <thead><tr><th>Ngày</th><th>Nội dung</th></tr></thead>
    <tbody>
      {% for i in data %}
      <tr><td>{{ i.Ngay }}</td><td>{{ i.NoiDung }}</td></tr>
      {% empty %}
      <tr><td colspan="2" class="text-center">Chưa có bản ghi nào.</td></tr>
      {% endfor %}
    </tbody>
  </table>

  <div class="text-center mt-3">
    <a href="/" class="btn btn-secondary">⬅ Về trang chính</a>
  </div>
</body>
</html>
